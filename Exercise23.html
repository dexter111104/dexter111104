<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Perfect Design Spec</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Roboto', sans-serif;
        padding: 50px;
        background-color: #e5e5e5; /* 讓白色視窗更明顯的背景底色 */
    }

    /* --- 整體框架 --- */
    .widget-container {
        width: 496px; /* Spec 標示總寬 496 */
        background-color: #ffffff;
        border: 1px solid #cfddff;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* --- 頂部 Header --- */
    .widget-header {
        height: 35px; /* Spec 標示高度 35 */
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-left: 15px; 
        padding-right: 15px;
        background-color: #f6f6f6; /* Header 預設淺灰底色 */
        border-bottom: 1px solid #eaeaea;
    }

    .header-title {
        font-size: 13px;
        color: #707070;
    }

    /* --- 嚴格還原的按鈕 --- */
    .spec-btn {
        height: 22px;             /* size : h22 */
        border-radius: 8px;       /* size : R8 */
        padding: 0 18px;          /* 左右各 18px */
        
        background-color: #ffffff;/* background #ffffff */
        border: 1px solid #2f2f2f;/* outline 1px #2f2f2f */
        
        font-family: 'Roboto', sans-serif; /* Font style */
        font-size: 13px;          /* Roboto Regular 13px */
        color: #2f2f2f;           /* Color : #2f2f2f */
        
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
    }

    .spec-btn:hover {
        background-color: #f2f2f2;
    }

    /* --- 滾動與內容區域 --- */
    .scroll-area {
        max-height: 350px;
        overflow-y: auto;
        overflow-x: hidden;
        padding-top: 20px;
        padding-bottom: 10px;     /* Min 10 底部留白 */
    }

    /* 圖片設定 */
    .preview-image {
        width: 450px;             /* Spec: 450 */
        height: 240px;            /* Spec: 240 */
        margin-left: 20px;        /* Spec: 左距 20 */
        margin-right: 26px;       /* Spec: 右距 26 */
        
        /* 模擬圖片的橘色底圖 */
        background-color: #ffb480; 
        background-image: linear-gradient(rgba(255, 150, 100, 0.7), rgba(255, 150, 100, 0.7)), url('https://via.placeholder.com/450x240/ffb480/0000ff?text=Default+450x240');
        background-size: cover;
        background-position: center;
        
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #0000ff;
        font-weight: bold;
        font-size: 14px;
        line-height: 1.5;
    }

    /* --- 詳細資訊字體設定 --- */
    .details-pane {
        display: none;            /* 預設隱藏 */
        margin-left: 20px;        /* 繼承左距 20 */
        margin-right: 26px;       /* 繼承右距 26 */
        margin-top: 10px;         /* 距離上方圖片 10px */
    }

    .detail-text {
        font-family: 'Roboto', sans-serif;
        font-size: 13px;          /* Roboto Regular 13px */
        color: #707070;           /* Color: #707070 */
        margin-bottom: 6px;       /* Spec: 行與行之間 6px */
        word-break: break-all;    /* 處理超長路徑不斷行的問題 */
    }

    .detail-text:last-child {
        margin-bottom: 0;
    }

    /* --- 自訂捲軸樣式 (模擬右側 Scrolling bar) --- */
    ::-webkit-scrollbar {
        width: 14px;
    }
    ::-webkit-scrollbar-track {
        background: #f9f9f9; 
        border-left: 1px solid #eaeaea;
    }
    ::-webkit-scrollbar-thumb {
        background: #cccccc; 
        border: 4px solid #f9f9f9;
        border-radius: 10px;
    }
</style>
</head>
<body>

<div class="widget-container">
    
    <div class="widget-header">
        <div class="header-title">預覽</div>
        <button class="spec-btn" id="actionBtn" onclick="toggleDetails()">查看資訊</button>
    </div>

    <div class="scroll-area">
        <div class="preview-image"></div>
        
        <div class="details-pane" id="infoBox">
            <div class="detail-text">修改日期 : 2017/10/12</div>
            <div class="detail-text">類別 : JPG</div>
            <div class="detail-text">大小 : 466.97KB</div>
            <div class="detail-text">路徑 : \\designcenter.qnap.com.tw\DesignCenter\PM，RD 請進入\\WEB\Stations\A_Image2PDF\v2\sample</div>
        </div>
    </div>

</div>

<script>
    function toggleDetails() {
        const infoBox = document.getElementById('infoBox');
        const btn = document.getElementById('actionBtn');
        
        if (infoBox.style.display === 'block') {
            infoBox.style.display = 'none';
            btn.textContent = '查看資訊'; 
        } else {
            infoBox.style.display = 'block';
            btn.textContent = '收起資訊'; // 根據截圖，展開後按鈕文字會改變
        }
    }
</script>

</body>
</html>
